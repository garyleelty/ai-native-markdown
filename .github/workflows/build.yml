name: Build Desktop Apps

# ──────────────────────────────────────────────
# 构建桌面版应用 (macOS / Windows / Linux)
# ──────────────────────────────────────────────
# 触发条件:
#   - 推送到 main / master 分支
#   - 手动触发 (workflow_dispatch)
# 产物:
#   - 每个平台打包为 zip/tar.gz，上传到 Actions Artifacts
#   - 未签名，运行时需手动允许 (macOS 右键打开)
# ──────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - master
      - empty-branch
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'dogfood-output/**'
  workflow_dispatch:
    inputs:
      debug:
        description: '启用详细日志'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

env:
  FLUTTER_VERSION: 'stable'
  APP_NAME: 'aeromind'

jobs:
  # ──────────────────────────────────────────────
  # 预检查: 静态分析 + 单元测试
  # ──────────────────────────────────────────────
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: dart analyze lib/ --fatal-infos=false

      - name: Tests
        run: flutter test --coverage || true

  # ──────────────────────────────────────────────
  # macOS 构建 (.app → zip)
  # ──────────────────────────────────────────────
  build-macos:
    name: Build macOS
    needs: analyze
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS app
        run: flutter build macos --release --no-codesign

      - name: Package .app to zip
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent ${{ env.APP_NAME }}.app ${{ env.APP_NAME }}-macos.zip
          ls -lh ${{ env.APP_NAME }}-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroMind-macos
          path: build/macos/Build/Products/Release/${{ env.APP_NAME }}-macos.zip
          retention-days: 30
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Windows 构建 (.exe → zip)
  # ──────────────────────────────────────────────
  build-windows:
    name: Build Windows
    needs: analyze
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows app
        run: flutter build windows --release

      - name: Package to zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ${{ env.APP_NAME }}-windows.zip -Force
          Get-Item ${{ env.APP_NAME }}-windows.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroMind-windows
          path: ${{ env.APP_NAME }}-windows.zip
          retention-days: 30
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Linux 构建 (bundle → tar.gz)
  # ──────────────────────────────────────────────
  build-linux:
    name: Build Linux
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgcrypt20-dev libsecret-1-dev libfuse2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux app
        run: flutter build linux --release

      - name: Package to tar.gz
        run: |
          cd build/linux/x64/release
          tar -czf ${{ env.APP_NAME }}-linux.tar.gz bundle
          ls -lh ${{ env.APP_NAME }}-linux.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroMind-linux
          path: build/linux/x64/release/${{ env.APP_NAME }}-linux.tar.gz
          retention-days: 30
          if-no-files-found: error
