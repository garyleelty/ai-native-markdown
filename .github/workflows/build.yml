name: Build Windows Electron App

on:
  push:
    branches: [main, web]
    tags:
      - 'v*'
  pull_request:
    branches: [main, web]

jobs:
  test:
    name: Test
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Type check
        run: npm run typecheck
        
      - name: Run tests
        run: npm run test
        env:
          CI: true

  build:
    name: Build
    runs-on: windows-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build Electron app
        run: npm run electron:build