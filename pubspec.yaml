name: aeromind
description: AI Native 笔记应用 — Sliding Panes + 实体识别 + 语义上下文
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── 状态管理 ──
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── 数据持久化 ──
  hive_flutter: ^1.1.0          # 轻量 KV 存储 (笔记元数据)
  isar: ^3.1.0+1                # 高性能本地 DB (向量索引)
  isar_flutter_libs: ^3.1.0+1   # Isar 平台库
  path_provider: ^2.1.3         # 本地路径

  # ── Markdown ──
  flutter_markdown: ^0.7.3      # Markdown 渲染
  markdown: ^7.2.2              # 底层解析

  # ── 文件操作 ──
  file_picker: ^8.0.3           # 本地 .md 文件选取
  path: ^1.9.0

  # ── 工具 ──
  uuid: ^4.3.3
  intl: ^0.19.0
  collection: ^1.18.0

  # ── 语义引擎 ──
  onnxruntime_v2: ^1.23.2+2      # ONNX 运行时 (本地向量推理)

  hive: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
